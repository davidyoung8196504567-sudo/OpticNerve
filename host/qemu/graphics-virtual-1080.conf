# Screen configuration for the QNX QEMU guest: one virtual display in memory, no GPU. The image's own
# /usr/share/screen/graphics-virtual-display.conf, with the Pi 5's 1920 x 1080 instead of 1280 x 768, so that
# demo_panel and the tests see the same screen as on the Pi. Started by host/qemu/guest_screen.sh.
begin winmgr
  begin globals
    alloc-config = stdbuf
    blit-config = sw
  end globals

  begin virtual display
    id_string = virtual-1
    video-mode = 1920 x 1080 @ 60
    format = rgba8888
    usage =  sw
  end virtual display
end winmgr
