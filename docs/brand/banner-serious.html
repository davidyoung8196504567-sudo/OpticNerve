<!doctype html>
<html><head><meta charset="utf-8"><title>OpticNerve banner (serious)</title>
<style>html,body{margin:0;padding:0;background:#0b1622}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1c2d40" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="vignette" cx="35%" cy="50%" r="75%">
      <stop offset="0" stop-color="#0b1622" stop-opacity="0"/>
      <stop offset="1" stop-color="#060c13" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#12324a"/>
      <stop offset="1" stop-color="#0a1a29"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="#0b1622"/>
  <rect width="1800" height="1200" fill="url(#grid)"/>
  <rect width="1800" height="1200" fill="url(#vignette)"/>

  <!-- the eye -->
  <g transform="translate(420 560) scale(0.9)">
    <path d="M-300 0 Q0 -250 300 0 Q0 250 -300 0 Z" fill="#0d1d2d" stroke="#2dd4bf" stroke-width="13" stroke-linejoin="round"/>
    <circle r="132" fill="url(#iris)" stroke="#2dd4bf" stroke-width="11"/>
    <circle r="106" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="6 10"/>
    <!-- pupil: a screen showing a power button, i.e. "ON" -->
    <rect x="-66" y="-46" width="132" height="92" rx="10" fill="#071119" stroke="#e6edf3" stroke-width="6"/>
    <g filter="url(#glow)">
      <path d="M-17 -19 A26 26 0 1 0 17 -19" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 -31 V-4" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- the nerve: a patient-monitor heartbeat trace from the eye to the name -->
  <g transform="translate(-80 0)">
    <path d="M770 560 H792 l9 -12 l9 12 H822 l7 16 l13 -130 l14 154 l9 -40 H872 L940 640 H1720" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M770 560 H792 l9 -12 l9 12 H822 l7 16 l13 -130 l14 154 l9 -40 H872 L940 640 H1720" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="770" cy="560" r="12" fill="#0b1622" stroke="#2dd4bf" stroke-width="6"/>
    <circle cx="1720" cy="640" r="14" fill="#2dd4bf"/>
  </g>

  <!-- name and taglines -->
  <text x="850" y="590" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="700" font-size="156" fill="#ffffff" letter-spacing="1"><tspan fill="#2dd4bf">O</tspan>ptic<tspan fill="#2dd4bf">N</tspan>erve</text>
  <text x="856" y="742" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="600" font-size="48" fill="#e6edf3">Eyes and hands on any QNX 8.0 screen</text>
  <text x="858" y="816" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-weight="600" font-size="31" fill="#2dd4bf" letter-spacing="2.5">BECAUSE LIVES DEPEND ON WHAT'S ON THE SCREEN</text>
</svg>
</body></html>
