[pytest]
testpaths = tests/regression
# -ra: a summary line for every test not passed (a skip says why: no SDP, no Java, a viewer connected).
# The target's tests run only with --pi (tests/regression/conftest.py), whatever -m says: `pytest` is host-only,
# `pytest --pi` runs everything, `pytest --pi -m pi` the target's tests alone.
#
# **One process, never in parallel** (-p no:xdist): the target's tests share one agent, one demo panel and one SSH
# login, and several of the host tests start the same scripts; run side by side they collide. Parallel runs caused
# exactly that in IVR_CPP-OAS. With pytest-xdist installed, `-n` is refused rather than silently obeyed.
addopts = -ra --tb=short -p no:xdist --strict-markers
markers =
    pi: needs the target (the Pi 5 at ON_HOST, the agent running, ON_LOGIN_PASSWORD and ON_VNC_PASSWORD set); --pi
    slow: takes more than a few seconds (builds, compiles, network rounds); deselect with -m "not slow"
    watched: moves the target's pointer or types: runs only with --watched (and --pi), one at a time, watched, when agreed
