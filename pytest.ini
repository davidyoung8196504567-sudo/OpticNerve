[pytest]
testpaths = tests/regression
# -ra: a summary line for every test not passed (skips say why: no SDP, no Java, no Pi settings).
# -m "not pi": the default run needs no target. `pytest -m pi` runs only the target's tests, `pytest -m "pi or not pi"`
# all of them (a later -m replaces this one).
#
# **One process, never in parallel** (-p no:xdist): the target's tests share one agent, one demo panel and one SSH
# login, and several of the host tests start the same scripts; run side by side they collide. Parallel runs caused
# exactly that in IVR_CPP-OAS. With pytest-xdist installed, `-n` is refused rather than silently obeyed.
addopts = -ra --tb=short -m "not pi" -p no:xdist
markers =
    pi: needs the target (the Pi 5 at ON_HOST, the agent running, ON_LOGIN_PASSWORD and ON_VNC_PASSWORD set)
    slow: takes more than a few seconds (builds, compiles, network rounds); deselect with -m "not slow"
